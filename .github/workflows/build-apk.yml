name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up CMake
        uses: lukka/get-cmake@v4
        with:
          cmakeVersion: 3.22.1

      - name: Set up Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure native project
        run: cmake -G Ninja -S native -B native/build -DCMAKE_BUILD_TYPE=Debug

      - name: Build native fixture packs
        run: cmake --build native/build --target itantra-fixtures

      - name: Make Gradle executable
        working-directory: android-native
        run: chmod +x gradlew

      - name: Build APK
        working-directory: android-native
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iTantra-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk